<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <script>
      try {
        if (localStorage.getItem("poe-guides-theme") === "light") {
          document.documentElement.dataset.theme = "light";
        }
      } catch (_) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    <script src="{{ '/assets/js/theme.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/image-lightbox.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/instant-nav.js' | relative_url }}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="wrap header-inner">
        <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <div class="header-controls">
          <nav aria-label="Main navigation">
            <a href="{{ '/' | relative_url }}">Guides</a>
            <a href="{{ '/CONTRIBUTING/' | relative_url }}">Contribute</a>
            <a href="https://github.com/foxmapoe/poe-guides">GitHub</a>
          </nav>
          <button class="theme-toggle" id="theme-toggle" type="button">Light mode</button>
        </div>
      </div>
    </header>
    <main id="main" class="wrap page-content">
      {% if page.url != '/' %}<p class="back-link"><a href="{{ '/' | relative_url }}">← All campaign guides</a></p>{% endif %}
      <div class="content-grid">
        <aside class="sidebar">
          {% include guide-navigation.html %}
        </aside>
        <div class="main-content">
          {{ content | replace: '<img src=', '<img loading="lazy" decoding="async" src=' }}
        </div>
      </div>
    </main>
    <footer class="site-footer">
      <div class="wrap">
        <div>Community maintained · <a href="https://github.com/foxmapoe/poe-guides">Improve a guide on GitHub</a></div>
        <p>Poe-guides is not affiliated with or endorsed by Grinding Gear Games.</p>
      </div>
    </footer>
    <dialog class="image-lightbox" id="image-lightbox" aria-label="Expanded guide image">
      <button class="image-lightbox-close" type="button" aria-label="Close expanded image">Close</button>
      <img alt="">
    </dialog>
  </body>
</html>

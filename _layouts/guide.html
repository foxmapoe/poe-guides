---
layout: default
---
<article class="guide">
  <header class="guide-header">
    <p class="eyebrow">Act {{ page.act }}{% if page.game_version %} · Game version {{ page.game_version }}{% endif %}</p>
    <h1>{{ page.title }}</h1>
    {% if page.updated %}<p class="updated">Last checked: {{ page.updated | date: "%B %-d, %Y" }}</p>{% endif %}
  </header>
  <div class="guide-content">{{ content }}</div>
</article>
